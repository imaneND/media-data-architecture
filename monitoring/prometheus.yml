# monitoring/prometheus.yml
# Configuration Prometheus

global:
  scrape_interval: 15s      # Collecter des métriques toutes les 15 secondes
  evaluation_interval: 15s

scrape_configs:
  # Prometheus se surveille lui-même
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Surveiller MinIO
  - job_name: 'minio'
    static_configs:
      - targets: ['minio:9000']
    metrics_path: /minio/health/live

  # Surveiller PostgreSQL
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres:5432']

  # Surveiller Kafka
  - job_name: 'kafka'
    static_configs:
      - targets: ['kafka:9092']